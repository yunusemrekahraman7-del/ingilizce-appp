name: Build Android APK (Kivy/Buildozer)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ KRİTİK: Android cmdline-tools JDK 17 ister. Burada kesin olarak 17'yi seçiyoruz.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java version (debug)
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip git \
            build-essential \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            libffi-dev libssl-dev \
            liblzma-dev zlib1g-dev \
            libjpeg-dev \
            libsqlite3-dev \
            libncurses5-dev libncursesw5-dev \
            libreadline-dev \
            libgdbm-dev \
            libdb5.3-dev \
            libexpat1-dev \
            libgl1-mesa-dev \
            autoconf automake libtool pkg-config

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # İstersen hız için cache (zorunlu değil)
      - name: Cache Buildozer & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
