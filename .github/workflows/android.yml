name: Build Android APK (Kivy/Buildozer)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip unzip git \
            build-essential \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            libffi-dev libssl-dev \
            liblzma-dev zlib1g-dev \
            libjpeg-dev \
            libsqlite3-dev \
            libncurses5-dev libncursesw5-dev \
            libreadline-dev \
            libgdbm-dev \
            libdb5.3-dev \
            libexpat1-dev \
            libgl1-mesa-dev

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # ✅ AIDL hatasını çözen adım (build-tools + platformlar + lisans)
      - name: Install Android SDK Build-Tools (aidl)
        run: |
          set -e

          # Buildozer'ın SDK dizini
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          # SDK/cmdline-tools'i buildozer üzerinden indir
          yes | buildozer android sdk

          # sdkmanager yolu (bazı ortamlarda farklı olabilir)
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          fi

          # Lisansları kabul et (build-tools kurulumu için şart)
          yes | $SDKMANAGER --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          # AIDL içeren build-tools + gerekli platformlar
          $SDKMANAGER --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK (debug)
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
